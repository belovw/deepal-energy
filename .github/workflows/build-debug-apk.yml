name: Build Deepal Energy APK

on:
  push:
    branches:
      - main
      - variant-b-carproperty
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build and test debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepal-energy-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload main screen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepal-energy-main-screen
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepal-energy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
